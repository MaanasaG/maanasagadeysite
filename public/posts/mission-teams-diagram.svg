<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">The org chart is your first multi-agent system</title>
  <desc id="desc">Side-by-side comparison of a multi-agent system and a mission-team org — same design, two graphs.</desc>
  <rect width="720" height="480" fill="#F2F4EF"/>

  <text x="360" y="28" text-anchor="middle" font-family="Georgia, ui-serif, serif" font-size="16" fill="#1E2D1C">The org chart is your first multi-agent system</text>
  <text x="360" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A5A48">One design problem. Two graphs. Bounded units, routed to the work.</text>

  <!-- Left column -->
  <text x="175" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#3F5A3F">MULTI-AGENT SYSTEM</text>
  <rect x="105" y="92" width="140" height="36" rx="4" fill="#3F5A3F"/>
  <text x="175" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#F2F4EF">Orchestrator</text>

  <line x1="175" y1="128" x2="175" y2="148" stroke="#6E8A6E" stroke-width="1.5"/>
  <line x1="70" y1="148" x2="280" y2="148" stroke="#6E8A6E" stroke-width="1.5"/>
  <line x1="70" y1="148" x2="70" y2="160" stroke="#6E8A6E" stroke-width="1.5"/>
  <line x1="140" y1="148" x2="140" y2="160" stroke="#6E8A6E" stroke-width="1.5"/>
  <line x1="210" y1="148" x2="210" y2="160" stroke="#6E8A6E" stroke-width="1.5"/>
  <line x1="280" y1="148" x2="280" y2="160" stroke="#6E8A6E" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="160" width="60" height="44" rx="3" fill="#fff" stroke="#6E8A6E" stroke-width="1"/>
    <text x="70" y="178" text-anchor="middle" font-size="11" fill="#1E2D1C">Task</text>
    <text x="70" y="193" text-anchor="middle" font-size="9" fill="#4A5A48">one job</text>

    <rect x="110" y="160" width="60" height="44" rx="3" fill="#fff" stroke="#6E8A6E" stroke-width="1"/>
    <text x="140" y="178" text-anchor="middle" font-size="11" fill="#1E2D1C">Doc</text>
    <text x="140" y="193" text-anchor="middle" font-size="9" fill="#4A5A48">one job</text>

    <rect x="180" y="160" width="60" height="44" rx="3" fill="#fff" stroke="#6E8A6E" stroke-width="1"/>
    <text x="210" y="178" text-anchor="middle" font-size="11" fill="#1E2D1C">Review</text>
    <text x="210" y="193" text-anchor="middle" font-size="9" fill="#4A5A48">one job</text>

    <rect x="250" y="160" width="60" height="44" rx="3" fill="#fff" stroke="#6E8A6E" stroke-width="1"/>
    <text x="280" y="178" text-anchor="middle" font-size="11" fill="#1E2D1C">Test</text>
    <text x="280" y="193" text-anchor="middle" font-size="9" fill="#4A5A48">one job</text>
  </g>
  <text x="175" y="228" text-anchor="middle" font-family="Georgia, ui-serif, serif" font-style="italic" font-size="11" fill="#4A5A48">Spun up for the task. Torn down after.</text>

  <!-- Center -->
  <circle cx="360" cy="150" r="28" fill="#A96343"/>
  <text x="360" y="146" text-anchor="middle" font-family="Georgia, ui-serif, serif" font-size="18" fill="#F2F4EF">H</text>
  <text x="360" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.08em" fill="#F2F4EF">SAME</text>
  <text x="360" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.08em" fill="#F2F4EF">DESIGN</text>

  <!-- Right column -->
  <text x="545" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#7F452E">MISSION-TEAM ORG</text>
  <rect x="455" y="88" width="180" height="44" rx="4" fill="#7F452E"/>
  <text x="545" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#F2F4EF">Manager + PM</text>
  <text x="545" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#F2F4EF" opacity="0.85">(routed by strength)</text>

  <line x1="545" y1="132" x2="545" y2="148" stroke="#A96343" stroke-width="1.5"/>
  <line x1="430" y1="148" x2="660" y2="148" stroke="#A96343" stroke-width="1.5"/>
  <line x1="430" y1="148" x2="430" y2="160" stroke="#A96343" stroke-width="1.5"/>
  <line x1="545" y1="148" x2="545" y2="160" stroke="#A96343" stroke-width="1.5"/>
  <line x1="660" y1="148" x2="660" y2="160" stroke="#A96343" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="385" y="160" width="90" height="70" rx="3" fill="#fff" stroke="#A96343" stroke-width="1"/>
    <text x="430" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#1E2D1C">Checkout</text>
    <text x="430" y="194" text-anchor="middle" font-size="8.5" fill="#4A5A48">payments eng</text>
    <text x="430" y="206" text-anchor="middle" font-size="8.5" fill="#4A5A48">frontend eng</text>
    <text x="430" y="218" text-anchor="middle" font-size="8.5" fill="#4A5A48">+ QA embed</text>

    <rect x="500" y="160" width="90" height="70" rx="3" fill="#fff" stroke="#A96343" stroke-width="1"/>
    <text x="545" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#1E2D1C">Search</text>
    <text x="545" y="194" text-anchor="middle" font-size="8.5" fill="#4A5A48">ML eng</text>
    <text x="545" y="206" text-anchor="middle" font-size="8.5" fill="#4A5A48">backend eng</text>
    <text x="545" y="218" text-anchor="middle" font-size="8.5" fill="#4A5A48">+ QA embed</text>

    <rect x="615" y="160" width="90" height="70" rx="3" fill="#fff" stroke="#A96343" stroke-width="1"/>
    <text x="660" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#1E2D1C">Onboarding</text>
    <text x="660" y="194" text-anchor="middle" font-size="8.5" fill="#4A5A48">fullstack eng</text>
    <text x="660" y="206" text-anchor="middle" font-size="8.5" fill="#4A5A48">design eng</text>
    <text x="660" y="218" text-anchor="middle" font-size="8.5" fill="#4A5A48">+ QA embed</text>
  </g>
  <text x="545" y="252" text-anchor="middle" font-family="Georgia, ui-serif, serif" font-style="italic" font-size="11" fill="#4A5A48">Formed for the mission. Reshaped once it&apos;s solved.</text>

  <!-- Footer -->
  <line x1="80" y1="280" x2="640" y2="280" stroke="#6E8A6E" stroke-width="0.75" opacity="0.5"/>
  <text x="360" y="312" text-anchor="middle" font-family="Georgia, ui-serif, serif" font-size="18" fill="#3F5A3F">Stop assigning rows. Start designing conditions.</text>
  <text x="360" y="340" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A5A48">Mission before structure � Bounded context � Compose dynamically � Orchestrate, then coach</text>
  <text x="360" y="372" text-anchor="middle" font-family="Georgia, ui-serif, serif" font-style="italic" font-size="12" fill="#1E2D1C">The org chart is your first multi-agent system — same design, two graphs.</text>

  <!-- Sprout -->
  <g transform="translate(360, 410)">
    <path d="M0 28 C0 12, -10 4, -16 -2" fill="none" stroke="#3F5A3F" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 28 C0 12, 10 4, 16 -2" fill="none" stroke="#3F5A3F" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-18" cy="-6" rx="10" ry="6" fill="#6E8A6E" transform="rotate(-30 -18 -6)"/>
    <ellipse cx="18" cy="-6" rx="10" ry="6" fill="#6E8A6E" transform="rotate(30 18 -6)"/>
    <line x1="0" y1="28" x2="0" y2="40" stroke="#3F5A3F" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
